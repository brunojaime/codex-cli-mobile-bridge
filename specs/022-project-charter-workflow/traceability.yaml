spec_id: 022-project-charter-workflow
title: Project Charter Workflow
status: completed

requirements:
  FR-001:
    description: New Project must materialize an approved and integrity-protected charter before model-driven work.
    acceptance_criteria: [AC-001, AC-002]
    tasks: [T001, T002, T003]
    diagrams: [project-charter-sequence]
    phase: 1
  FR-002:
    description: Project Factory and Domain Factory must fail closed when the required charter contract is unavailable.
    acceptance_criteria: [AC-003, AC-004]
    tasks: [T004, T005]
    diagrams: [project-charter-sequence]
    phase: 2
  FR-003:
    description: SDD must expose the charter as a first-class governance document for generated projects.
    acceptance_criteria: [AC-005]
    tasks: [T006]
    diagrams: [project-charter-sequence]
    phase: 3
  FR-004:
    description: Flutter must provide comfortable responsive reading and complete multi-recipient email sharing.
    acceptance_criteria: [AC-006, AC-007]
    tasks: [T007, T008, T009]
    diagrams: [project-charter-sequence]
    phase: 4

diagrams:
  project-charter-sequence:
    path: diagrams/sequence.mmd
    requirements: [FR-001, FR-002, FR-003, FR-004]

acceptance_criteria:
  AC-001: An unapproved or scope-empty draft cannot create a charter.
  AC-002: Charter metadata records approval and matches the Markdown SHA-256 digest.
  AC-003: Full generation cannot start from a blocked deterministic init.
  AC-004: Missing or invalid charter evidence blocks factories before agents run.
  AC-005: SDD returns the complete charter and reports it missing for generated projects.
  AC-006: Phone and tablet readers render selectable content without overflow.
  AC-007: Email sharing preserves recipients and full-document delivery choice.

implementation:
  status: completed
  completed_tasks: [T001, T002, T003, T004, T005, T006, T007, T008, T009]
  pending_tasks: []

